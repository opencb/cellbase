name: CellBase Develop workflow

on:
  push:
    branches:
      - develop
      - release-*
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test-analysis.yml
    secrets: inherit

  deploy-maven:
    uses: opencb/java-common-libs/.github/workflows/deploy-maven-repository-workflow.yml@develop
    needs: test
    with:
      maven_opts: -Dcheckstyle.skip -DCELLBASE.WAR.NAME=cellbase -P default-config-test
    secrets: inherit

  deploy-zetta-docker:
    uses: opencb/java-common-libs/.github/workflows/deploy-zetta-docker-hub-workflow.yml@develop
    needs: test
    with:
      cli: python3 ./build/cloud/docker/docker-build.py push --images base
    secrets: inherit
