name: Build and test the project

on:
  workflow_call:
    inputs:
      upload_artifact:
        type: boolean
        required: false
        default: false
    outputs:
      cache_key:
        description: "Cache key used for Maven repository"
        value: ${{ jobs.build.outputs.cache_key }}
    secrets:
      SONAR_TOKEN:
        required: true

jobs:

  build:
    uses: opencb/java-common-libs/.github/workflows/build-java-app-workflow.yml@develop
    with:
      needs_hadoop_preparation: false
      maven_opts: -Dcheckstyle.skip
      upload_artifact: ${{ inputs.upload_artifact }}
      dependency_repos: "java-common-libs,biodata"
    secrets: inherit

  test:
    name: Test and push Sonar analysis
    needs: build
    runs-on: ${{ vars.UBUNTU_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: K8s Tunnel MongoDB
        run: |
          wget https://dl.k8s.io/release/v1.28.2/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          echo "${{ secrets.AZURE_KUBE_CONFIG }}" > admin.conf 
          ./kubectl -n cellbase-db port-forward services/cellbase-rs0-svc 27017:27017 --kubeconfig ./admin.conf &
      - name: Cache local Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ needs.build.outputs.cache_key }}
          ## Force cache hit to avoid testing with incomplete dependencies
          fail-on-cache-miss: true
      - name: Test and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify surefire-report:report --fail-never -Dcheckstyle.skip org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=opencb_cellbase -DCELLBASE.WAR.NAME=cellbase
      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        ## Skip cancelled()
        ## https://docs.github.com/en/actions/learn-github-actions/expressions#cancelled
        if: success() || failure()
        with:
          check_name: "Surefire tests report"
          report_paths: './**/surefire-reports/TEST-*.xml'
          commit: '${{ github.sha }}'
          fail_on_test_failures: true
